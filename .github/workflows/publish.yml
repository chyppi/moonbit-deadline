name: Publish Mooncakes package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check package
        run: |
          moon version --all
          moon update
          moon check --deny-warn
          moon test --deny-warn
          moon fmt
          git diff --exit-code
          moon info
          git diff --ignore-blank-lines --exit-code

      - name: Publish
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        shell: bash
        run: |
          if [ -z "$MOONCAKES_TOKEN" ]; then
            echo "MOONCAKES_TOKEN repository secret is required"
            exit 1
          fi
          printf '%s' "$MOONCAKES_TOKEN" > "$HOME/.moon/credentials.json"
          moon publish
          rm -f "$HOME/.moon/credentials.json"
